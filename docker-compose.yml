services:
  collector:
    build: ./collector
    restart: unless-stopped
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      DATA_DIR: /data
      ADMIN_PORT: "${COLLECTOR_PORT}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ALLOWED_CHAT_JIDS: "${ALLOWED_CHAT_JIDS:-}"
    ports:
      - "${COLLECTOR_PORT}:${COLLECTOR_PORT}"   # admin UI


  processor:
    build: ./processor
    restart: unless-stopped
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "${PROCESSOR_PORT}:8080"   # manual trigger endpoint
