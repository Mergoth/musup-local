services:
  collector:
    build: ./collector
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      ADMIN_PORT: "8081"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ALLOWED_CHAT_JIDS: "${ALLOWED_CHAT_JIDS:-}"
    ports:
      - "8081:8081"   # admin UI

  processor:
    build: ./processor
    restart: unless-stopped
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "8080:8080"   # manual trigger endpoint
