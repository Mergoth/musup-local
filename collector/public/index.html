<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>musup admin</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f5; color: #222; }
  h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
  .card { background: white; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .card h2 { margin: 0 0 1rem; font-size: 1.1rem; }
  .badge { display: inline-block; padding: .25rem .6rem; border-radius: 999px; font-size: .8rem; font-weight: 600; background: #e5e7eb; color: #374151; }
  .badge-connected { background: #d1fae5; color: #065f46; }
  .badge-disconnected { background: #fee2e2; color: #991b1b; }
  .badge-qr_pending { background: #fef3c7; color: #92400e; }
  button { padding: .4rem .9rem; border: none; border-radius: 6px; cursor: pointer; font-size: .9rem; background: #3b82f6; color: white; margin-right: .5rem; }
  button.danger { background: #ef4444; }
  button.save { background: #10b981; }
  button:disabled { opacity: .5; cursor: default; }
  #qr-img { display: block; margin: 1rem auto; width: 200px; height: 200px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: .5rem .75rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
  th { font-weight: 600; background: #f9fafb; }
  input[type=text] { padding: .4rem .7rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .9rem; width: 230px; }
  .tag { display: inline-flex; align-items: center; gap: .3rem; background: #e5e7eb; border-radius: 999px; padding: .2rem .65rem; font-size: .85rem; margin: .2rem; }
  .tag button { background: none; color: #6b7280; padding: 0 .2rem; font-size: 1.1rem; margin: 0; line-height: 1; }
  .tag button:hover { color: #ef4444; }
  .row-actions { margin-top: 1rem; display: flex; gap: .5rem; align-items: center; }
</style>
</head>
<body>
<h1>musup admin</h1>

<div class="card">
  <h2>WhatsApp Connection</h2>
  <p>Status: <span id="status-badge" class="badge badge-disconnected">disconnected</span></p>
  <img id="qr-img" style="display:none" alt="QR code — scan with WhatsApp Linked Devices">
  <div style="margin-top:.75rem">
    <button onclick="reconnect()">Reconnect</button>
    <button class="danger" onclick="logout()">Logout &amp; clear auth</button>
  </div>
</div>

<div class="card">
  <h2>Telegram Chat IDs</h2>
  <div id="telegram-tags"></div>
  <div class="row-actions">
    <input type="text" id="new-tg" placeholder="e.g. -100123456789">
    <button onclick="addTelegramId()">Add</button>
  </div>
</div>

<div class="card">
  <h2>Chat Subscriptions</h2>
  <p style="font-size:.85rem;color:#6b7280;margin-bottom:.75rem">
    <strong>Collect</strong> = save messages to disk &nbsp;·&nbsp; <strong>Digest</strong> = include in Telegram summary.<br>
    <em>Tip: if all boxes in a column are unchecked, that column allows all chats.</em>
  </p>
  <table>
    <thead><tr><th>Name</th><th>JID</th><th>Collect</th><th>Digest</th></tr></thead>
    <tbody id="chats-tbody"></tbody>
  </table>
  <div class="row-actions">
    <button class="save" onclick="saveChats()">Save subscription changes</button>
  </div>
</div>

<script>
let cfg = { allowedChatJids: [], processorChatJids: [], chatLabels: {}, telegramChatIds: [] };
let chats = [];

async function init() {
  try {
    const [configRes, chatsRes] = await Promise.all([
      fetch('/api/config'),
      fetch('/api/chats'),
    ]);
    if (configRes.status === 401 || chatsRes.status === 401) {
      location.href = '/login.html';
      return;
    }
    if (!configRes.ok || !chatsRes.ok) throw new Error('Server error');
    cfg = await configRes.json();
    chats = await chatsRes.json();
    renderTelegramTags();
    renderChats();
  } catch (e) {
    document.body.innerHTML = `<p style="padding:2rem;color:#dc2626">Failed to load admin UI: ${e.message}. <a href="/login.html">Re-login?</a></p>`;
    return;
  }
  fetch('/api/status').then(r => r.json()).then(applyStatus).catch(() => {});
}

function connectWs() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'status') applyStatus(m); };
  ws.onclose = () => setTimeout(connectWs, 3000);
}

function applyStatus(m) {
  const badge = document.getElementById('status-badge');
  badge.textContent = m.status;
  badge.className = `badge badge-${m.status}`;
  const img = document.getElementById('qr-img');
  if (m.status === 'qr_pending' && m.qrDataUrl) { img.src = m.qrDataUrl; img.style.display = 'block'; }
  else img.style.display = 'none';
}

async function reconnect() { await fetch('/api/reconnect', { method: 'POST' }); }
async function logout() {
  if (!confirm('Clear WhatsApp auth and restart? You will need to re-scan QR.')) return;
  await fetch('/api/logout', { method: 'POST' });
}

function renderTelegramTags() {
  const el = document.getElementById('telegram-tags');
  if (!cfg.telegramChatIds.length) {
    el.innerHTML = '<em style="color:#9ca3af">No Telegram chat IDs configured</em>';
    return;
  }
  el.innerHTML = '';
  cfg.telegramChatIds.forEach(id => {
    const s = document.createElement('span');
    s.className = 'tag';
    const text = document.createTextNode(id + ' ');
    const btn = document.createElement('button');
    btn.title = 'Remove';
    btn.textContent = '×';
    btn.addEventListener('click', () => removeTelegramId(id));
    s.appendChild(text);
    s.appendChild(btn);
    el.appendChild(s);
  });
}

async function addTelegramId() {
  const inp = document.getElementById('new-tg');
  const v = inp.value.trim();
  if (!v) return;
  if (cfg.telegramChatIds.includes(v)) { alert('Already in list'); return; }
  cfg.telegramChatIds = [...cfg.telegramChatIds, v];
  inp.value = '';
  await saveCfg();
  renderTelegramTags();
}

async function removeTelegramId(id) {
  cfg.telegramChatIds = cfg.telegramChatIds.filter(x => x !== id);
  await saveCfg();
  renderTelegramTags();
}

function renderChats() {
  const tbody = document.getElementById('chats-tbody');
  tbody.innerHTML = '';
  if (!chats.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="color:#9ca3af;font-style:italic">No chats seen yet — send a message to a group to register it</td></tr>';
    return;
  }
  chats.forEach(chat => {
    const tr = document.createElement('tr');
    tr.dataset.jid = chat.jid;
    tr.innerHTML = `<td>${esc(chat.name)}</td>
      <td style="font-size:.78rem;color:#6b7280">${esc(chat.jid)}</td>
      <td><input type="checkbox" data-role="collector" ${chat.collectorEnabled ? 'checked' : ''}></td>
      <td><input type="checkbox" data-role="processor" ${chat.processorEnabled ? 'checked' : ''}></td>`;
    tbody.appendChild(tr);
  });
}

async function saveChats() {
  const rows = document.querySelectorAll('#chats-tbody tr[data-jid]');
  const c = [], p = [];
  rows.forEach(row => {
    const jid = row.dataset.jid;
    if (row.querySelector('[data-role=collector]').checked) c.push(jid);
    if (row.querySelector('[data-role=processor]').checked) p.push(jid);
  });
  cfg.allowedChatJids = c;
  cfg.processorChatJids = p;
  await saveCfg();
  alert('Saved!');
}

async function saveCfg() {
  await fetch('/api/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

init();
connectWs();
</script>
</body>
</html>
