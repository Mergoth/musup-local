micronaut:
  application:
    name: musup-processor

musup:
  data-dir: ${DATA_DIR:/data}

  llm-api-url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
  llm-model: gemini-3-flash-preview
  llm-api-key: ${LLM_API_KEY}

  # Quartz cron (UTC): second minute hour dom month dow
  # 06:00 and 19:00 UTC = 08:00 and 21:00 Madrid (winter), 08:00 and 21:00 CEST (summer)
  digest-cron: "0 0 6,19 * * ?"

  # Hours to look back on each run (covers gap between the two daily runs)
  digest-window-hours: 13

  telegram-bot-token: ${TELEGRAM_BOT_TOKEN}
  telegram-chat-ids:
    - ${TELEGRAM_CHAT_ID_1}
    - ${TELEGRAM_CHAT_ID_2:""}

  # WhatsApp group JIDs to include in digest (empty = all captured chats)
  # Set via MUSUP_CHAT_JIDS env var (comma-separated) to keep JIDs out of git.
  chat-jids: []

  # Human-readable label overrides: "jid1=Label One,jid2=Label Two"
  # Set via MUSUP_CHAT_LABELS_CSV env var to keep labels out of git.
  chat-labels-csv: ""
